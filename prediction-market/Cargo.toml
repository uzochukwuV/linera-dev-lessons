[package]
name = "prediction-market"
version = "0.1.0"
edition = "2021"

[dependencies]
async-graphql = "=7.0.17"
linera-sdk = "0.15.7"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
thiserror = "2.0.9"
http = "1.2.0"

[dev-dependencies]
linera-sdk = { version = "0.15.7", features = ["test"] }

[build-dependencies]
linera-sdk = "0.15.7"

[[bin]]
name = "prediction_market_contract"
path = "src/contract.rs"

[[bin]]
name = "prediction_market_service"
path = "src/service.rs"

[profile.release]
opt-level = 'z'
lto = true
